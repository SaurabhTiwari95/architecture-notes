name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so gitleaks scans every commit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Pre-publish check (private words, IPs, emails, phones, AWS ids)
        env:
          BLOCKED_WORDS: ${{ secrets.BLOCKED_WORDS }}
        run: python scripts/prepublish_check.py

      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Python
        run: ruff check . && ruff format --check .

      - name: Tests with coverage
        run: pytest

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path .github "./**/*.md"
          fail: true
